<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="440" fill="#ffffff"/>

  <text x="310" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">4x4 Matrix Keypad — Internal Wiring</text>

  <!-- Column labels -->
  <g font-size="11" fill="#1a1a1a" text-anchor="middle">
    <text x="220" y="48">C1</text><text x="220" y="61">(PC4)</text>
    <text x="300" y="48">C2</text><text x="300" y="61">(PC5)</text>
    <text x="380" y="48">C3</text><text x="380" y="61">(PC6)</text>
    <text x="460" y="48">C4</text><text x="460" y="61">(PC7)</text>
  </g>

  <!-- Column lines -->
  <g stroke="#1a1a1a" stroke-width="1.5">
    <line x1="220" y1="70" x2="220" y2="350"/>
    <line x1="300" y1="70" x2="300" y2="350"/>
    <line x1="380" y1="70" x2="380" y2="350"/>
    <line x1="460" y1="70" x2="460" y2="350"/>
  </g>

  <!-- Row lines -->
  <line x1="150" y1="110" x2="500" y2="110" stroke="#b0281a" stroke-width="2.5"/>
  <g stroke="#1a1a1a" stroke-width="1.5">
    <line x1="150" y1="180" x2="500" y2="180"/>
    <line x1="150" y1="250" x2="500" y2="250"/>
    <line x1="150" y1="320" x2="500" y2="320"/>
  </g>

  <!-- Row labels -->
  <g font-size="12" fill="#1a1a1a" text-anchor="end">
    <text x="140" y="107" fill="#b0281a" font-weight="bold">R1 (PD0)</text>
    <!-- R1 highlighted as the active row: driven HIGH while the rest stay LOW -->

    <text x="140" y="184">R2 (PD1)</text>
    <text x="140" y="254">R3 (PD2)</text>
    <text x="140" y="324">R4 (PD3)</text>
  </g>

  <!-- Keys at intersections -->
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    <!-- Row 1 -->
    <circle cx="220" cy="110" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="220" y="114">1</text>
    <circle cx="300" cy="110" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="300" y="114">2</text>
    <circle cx="380" cy="110" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="380" y="114">3</text>
    <circle cx="460" cy="110" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="460" y="114">A</text>
    <!-- Row 2 -->
    <circle cx="220" cy="180" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="220" y="184">4</text>
    <circle cx="300" cy="180" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="300" y="184">5</text>
    <circle cx="380" cy="180" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="380" y="184">6</text>
    <circle cx="460" cy="180" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="460" y="184">B</text>
    <!-- Row 3 -->
    <circle cx="220" cy="250" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="220" y="254">7</text>
    <circle cx="300" cy="250" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="300" y="254">8</text>
    <circle cx="380" cy="250" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="380" y="254">9</text>
    <circle cx="460" cy="250" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="460" y="254">C</text>
    <!-- Row 4 -->
    <circle cx="220" cy="320" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="220" y="324">*</text>
    <circle cx="300" cy="320" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="300" y="324">0</text>
    <circle cx="380" cy="320" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="380" y="324">#</text>
    <circle cx="460" cy="320" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="460" y="324">D</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#1a1a1a">
    <circle cx="165" cy="385" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="182" y="389">= key: a switch joining its row wire to its column wire when pressed</text>
    <line x1="150" y1="410" x2="178" y2="410" stroke="#b0281a" stroke-width="2.5"/>
    <text x="182" y="414" fill="#b0281a">R1 shown driven HIGH as an example — only one row is HIGH at a time</text>
  </g>
</svg>
